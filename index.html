<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Log</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--tx:#0f1115;--mut:#6b7280;--ac:#6366f1;--bd:#e4e6ec;--dng:#ef4444;--sh:0 6px 20px rgba(20,24,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b10;--card:#161821;--tx:#f4f5f8;--mut:#9aa0ae;--bd:#252836;--sh:0 6px 20px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0b10;--card:#161821;--tx:#f4f5f8;--mut:#9aa0ae;--bd:#252836;--sh:0 6px 20px rgba(0,0,0,.45);color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:24px;margin:8px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:fade .4s both}
.card.ex{border-left:5px solid var(--s,var(--ac))}
.ex-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ex-h b{font-size:18px}
.last{color:var(--mut);font-size:13px;margin-bottom:10px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.set span{color:var(--mut);text-align:center;font-weight:600}
.set span.up{color:#fff;background:var(--s,var(--ac));border-radius:99px;padding:2px 0;animation:pop .35s}
.bw{text-align:center;color:var(--mut);padding:11px 0;border:1px dashed var(--bd);border-radius:12px;font-size:14px}
input{font:inherit;font-size:17px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px;width:100%;box-sizing:border-box;text-align:center}
input:focus{outline:2px solid var(--s,var(--ac));outline-offset:0}
input.name{text-align:left}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--bd);color:var(--tx);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.95)}
button.pri{background:var(--s,var(--ac));color:#fff;font-weight:600}
button.x{background:none;color:var(--dng);padding:6px 8px}
button.u{padding:5px 12px;font-weight:700;margin-right:6px;border-radius:99px;background:var(--s,var(--ac));color:#fff}
button.wide{width:100%;margin-top:8px}
button.fin{color:#fff;font-weight:700;font-size:17px;padding:15px;box-shadow:var(--sh)}
button.back{background:none;color:var(--mut);padding:6px 4px}
.row{display:flex;gap:8px;margin-bottom:6px}
.row input{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.big{position:relative;overflow:hidden;color:#fff;border-radius:22px;padding:16px 14px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--sh);animation:fade .4s both}
.big .em{font-size:32px}
.big b{font-size:21px;display:block}
.big small{opacity:.9;font-size:13px}
.big .chk{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.28);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.week{padding:14px}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);border-radius:99px;transition:width .5s}
.hero{border-radius:22px;padding:18px;color:#fff;margin-bottom:12px;box-shadow:var(--sh);animation:fade .4s both}
.hero h1{margin:0;font-size:28px}
.hero .sub{color:rgba(255,255,255,.85);margin:2px 0 12px}
.chip{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 11px;font-size:13px;margin-right:6px}
.pill{color:#fff;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border-radius:0;background:none;padding:15px;font-weight:600;color:var(--mut)}
.tabs button.on{color:var(--ac)}
.mut{color:var(--mut);font-size:13px}
.skipped{opacity:.55}
select{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px;width:100%;box-sizing:border-box;margin-bottom:10px}
.seg{display:flex;background:var(--bd);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;background:none;padding:8px;border-radius:10px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:var(--sh)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button.pill{padding:7px 14px;font-size:14px}
.chart svg{display:block;width:100%;height:auto;font-family:inherit}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.stat span{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 11px;font-size:13px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#st{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:12px;font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-90px);background:#16a34a;color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;box-shadow:var(--sh);transition:transform .35s;z-index:5;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<span id="st"></span>
<div id="toast"></div>
<main id="app"></main>
<nav class="tabs"><button id="t1">Workout</button><button id="t2">Progress</button><button id="t3">History</button></nav>
<script>
const $=s=>document.querySelector(s);
const KEY='gymlog.v2';
const SESSIONS=['Upper 1','Upper 2','Lower 1','Lower 2'];
const UNITS=['kg','lb','p','bw'];
const ULBL={kg:'kg',lb:'lb',p:'p',bw:'BW'};
const SC={'Upper 1':['#6366f1','#8b5cf6'],'Upper 2':['#0ea5e9','#6366f1'],'Lower 1':['#f97316','#ef4444'],'Lower 2':['#10b981','#0ea5e9']};
const EM={'Upper 1':'💪','Upper 2':'🏋️','Lower 1':'🦵','Lower 2':'🔥'};
const SEED={
 'Upper 1':[
  ['Chest press','kg',[[30,5],[25,7]]],
  ['Lat pulldown','p',[[8,6],[7,7]]],
  ['Upper back row','lb',[[87.5,7],[75,8]]],
  ['DB seated curl','kg',[[10,6],[7.5,8]]],
  ['Triceps pushdown','kg',[[10,6],[7.5,8]]]],
 'Upper 2':[
  ['Shoulder press','kg',[[50,8],[45,7]]],
  ['Lat pullover','p',[[6,7],[5,7]]],
  ['Shrugs','kg',[[12.5,10],[12.5,8]]],
  ['Chest fly','kg',[[40,5],[35,5]]],
  ['Triceps DB','kg',[[7.5,10],[7.5,6]]],
  ['Preacher curl','kg',[[7.5,8],[7.5,6]]]],
 'Lower 1':[
  ['Calf raises','kg',[[30,8],[30,6]]],
  ['Leg extension','kg',[[50,8],[50,7]]],
  ['Leg press','kg',[[40,8],[40,6]]],
  ['Back extension','bw',[[0,10],[0,8]]]],
 'Lower 2':[
  ['Calf press','kg',[['',''],['','']]],
  ['RDL','kg',[['',''],['','']]]]
};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ds(new Date());
const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const mk=(n,u,s)=>({name:n,unit:u,sets:s.map(([w,r])=>({w,r}))});
const grad=s=>{const c=SC[s]||SC['Upper 1'];return 'linear-gradient(135deg,'+c[0]+','+c[1]+')'};
let S=load(),view='home',tt;

function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.log))return o}catch(e){}return{log:[],draft:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

const lastOf=s=>{for(let i=S.log.length-1;i>=0;i--)if(S.log[i].session===s)return S.log[i];return null};
const plan=s=>{if(S.plan&&S.plan[s])return S.plan[s];const l=lastOf(s);return l?l.exercises:(SEED[s]||[]).map(([n,u,x])=>mk(n,u,x))};
const wtxt=(s,u)=>u==='bw'?'BW':(s.w===''?'?':s.w)+u;
const fmt=e=>e.sets.map(s=>wtxt(s,e.unit)+'×'+(s.r===''?'?':s.r)).join(', ');
const refEx=(session,name)=>{
  for(let i=S.log.length-1;i>=0;i--){
    if(S.log[i].session!==session)continue;
    const e=S.log[i].exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(e)return e;
  }
  return null;
};
function isUp(i,j){
  const d=S.draft,e=d.exercises[i],s=e.sets[j];
  if(e.skip)return false;
  const r=refEx(d.session,e.name),p=r&&r.sets[j];
  return !!(p&&s.r!==''&&(e.unit==='bw'||s.w!=='')&&(s.w>p.w||(s.w===p.w&&s.r>p.r)));
}
function countUps(){let n=0;S.draft.exercises.forEach((e,i)=>e.sets.forEach((s,j)=>{if(isUp(i,j))n++}));return n}
const upText=()=>{const n=countUps();return n?'▲ '+n+' improved':'Beat last time ▲'};
const doneWeek=s=>S.log.some(l=>l.session===s&&l.date>=weekStart());
function allNames(){
  const n=new Set();
  Object.values(SEED).forEach(x=>x.forEach(e=>n.add(e[0])));
  S.log.forEach(l=>l.exercises.forEach(e=>n.add(e.name)));
  return [...n].sort();
}
function unitFor(name){
  for(let i=S.log.length-1;i>=0;i--){const e=S.log[i].exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e)return e.unit}
  for(const k in SEED){const e=SEED[k].find(x=>x[0].toLowerCase()===name.toLowerCase());if(e)return e[1]}
  return 'kg';
}

function renderHome(){
  $('#app').style.removeProperty('--s');
  const n=SESSIONS.filter(doneWeek).length;
  let h='<h1>Gym Log</h1><div class="sub">Pick today’s session</div>'+
  '<div class="card week"><b>This week: '+n+' of 4 sessions</b><div class="bar"><i style="width:'+(n/4*100)+'%"></i></div></div><div class="grid">';
  SESSIONS.forEach((s,k)=>{
    const l=lastOf(s),dr=S.draft&&S.draft.session===s;
    h+='<button class="big" style="background:'+grad(s)+';animation-delay:'+(k*70)+'ms" data-start="'+s+'">'+
    (doneWeek(s)?'<span class="chk">✓ Done</span>':dr?'<span class="chk">In progress</span>':'')+
    '<span class="em">'+EM[s]+'</span><span><b>'+s+'</b><small>'+(l?'Last: '+l.date:'Not done yet')+'</small></span></button>';
  });
  $('#app').innerHTML=h+'</div>';
}

function renderSess(){
  const d=S.draft;
  $('#app').style.setProperty('--s',(SC[d.session]||SC['Upper 1'])[0]);
  let h='<button class="back" data-act="home">‹ Back</button><div class="hero" style="background:'+grad(d.session)+'"><h1>'+EM[d.session]+' '+esc(d.session)+'</h1><div class="sub">'+d.date+'</div>'+
  '<span class="chip">'+d.exercises.filter(e=>!e.skip).length+' exercises</span><span class="chip" id="upc">'+upText()+'</span></div>';
  if(!d.exercises.length)h+='<div class="card mut">No exercises yet. Add one below.</div>';
  d.exercises.forEach((e,i)=>{
    const r=refEx(d.session,e.name);
    h+='<div class="card ex'+(e.skip?' skipped':'')+'" style="animation-delay:'+(i*60)+'ms"><div class="ex-h"><b>'+esc(e.name)+'</b><span>'+
    (e.skip?'':'<button class="u" data-unit="'+i+'">'+ULBL[e.unit]+'</button>')+
    '<button class="x" data-skip="'+i+'">'+(e.skip?'Undo skip':'Skip')+'</button>'+(e.skip?'':'<button class="x" data-del="'+i+'">Remove</button>')+'</span></div>';
    if(e.skip){h+='<div class="last">Skipped today. It won’t be logged.</div></div>';return}
    h+='<div class="last">'+(r?'Last time: '+fmt(r):'First time')+'</div>';
    e.sets.forEach((s,j)=>{
      const up=isUp(i,j);
      h+='<div class="set"><span class="'+(up?'up':'')+'">'+(up?'▲':j+1)+'</span>'+
      (e.unit==='bw'?'<div class="bw">Bodyweight</div>':'<input type="number" inputmode="decimal" step="any" placeholder="'+e.unit+'" value="'+(s.w??'')+'" data-i="'+i+'" data-j="'+j+'" data-f="w">')+
      '<input type="number" inputmode="numeric" placeholder="reps" value="'+(s.r??'')+'" data-i="'+i+'" data-j="'+j+'" data-f="r">'+
      '<button class="x" data-ds="'+i+','+j+'">✕</button></div>';
    });
    h+='<button data-add="'+i+'">+ Add set</button></div>';
  });
  h+='<div class="card"><div class="row"><input class="name" id="nx" list="nl" placeholder="Add exercise"><button class="pri" id="addx">Add</button></div>'+
  '<datalist id="nl">'+allNames().map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist></div>'+
  '<button class="fin wide" style="background:'+grad(d.session)+'" data-act="finish">Finish workout ✓</button><button class="x wide" data-act="discard">Discard workout</button>';
  $('#app').innerHTML=h;
}

function renderHist(){
  $('#app').style.removeProperty('--s');
  const L=[...S.log].map((l,i)=>({l,i})).reverse();
  let h='<h1>History</h1><div class="sub">'+S.log.length+' workouts logged</div>';
  if(!L.length)h+='<div class="card mut">Nothing logged yet.</div>';
  L.forEach(({l,i})=>{
    h+='<div class="card"><div class="hh"><span><span class="pill" style="background:'+grad(l.session)+'">'+esc(l.session)+'</span> <span class="mut">'+l.date+'</span></span><button class="x" data-hdel="'+i+'">Delete</button></div>'+
    l.exercises.map(e=>'<div class="mut">'+esc(e.name)+': '+fmt(e)+'</div>').join('')+'</div>';
  });
  h+='<div class="card"><b>Backup</b><div class="mut" style="margin:4px 0 10px">Data lives on this phone only.</div><div class="row"><button data-act="copy">Copy backup</button><button data-act="restore">Restore</button></div></div>';
  $('#app').innerHTML=h;
}

/* ---------- Progress (read-only view of the log; never changes it) ---------- */
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const num=v=>Math.round(v*10)/10;
let P={session:null,ex:null,mode:'month',metric:'top',demo:false};
const demoLogs=()=>Array.from({length:12},(_,i)=>({session:'Upper 1',date:ds(new Date(2026,6+Math.floor(i/4),2+(i%4)*7)),
  exercises:[{name:'Chest press',unit:'kg',sets:[{w:30+Math.floor(i/2)*2.5,r:5+(i%2)},{w:25+Math.floor(i/2)*2.5,r:7}]}]}));
const src=()=>P.demo?demoLogs():S.log;
function exNames(sess){
  const m=new Map();
  src().filter(l=>l.session===sess).forEach(l=>l.exercises.forEach(e=>m.set(e.name.toLowerCase(),e.name)));
  return [...m.values()];
}
function buckets(){
  const L=src().filter(l=>l.session===P.session).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const out=new Map(),want=(P.ex||'').toLowerCase();
  L.forEach((l,i)=>{
    const key=P.mode==='month'?l.date.slice(0,7):Math.floor(i/5);
    if(!out.has(key))out.set(key,{from:i,to:i,date:l.date,tops:[],vols:[],unit:'kg'});
    const b=out.get(key);b.to=i;
    const e=l.exercises.find(x=>x.name.toLowerCase()===want);
    if(!e)return;
    const bw=e.unit==='bw';b.unit=e.unit;
    const vals=e.sets.map(s=>bw?+s.r||0:+s.w||0);
    b.tops.push(Math.max(...vals));
    b.vols.push(e.sets.reduce((a,s)=>a+(bw?(+s.r||0):(+s.w||0)*(+s.r||0)),0));
  });
  return [...out.values()].filter(b=>b.tops.length).map(b=>({
    label:P.mode==='month'?MN[+b.date.slice(5,7)-1]:(b.from+1)+'–'+(b.to+1),
    yr:P.mode==='month'?'’'+b.date.slice(2,4):'',mo:+b.date.slice(5,7),unit:b.unit,
    v:P.metric==='top'?Math.max(...b.tops):num(b.vols.reduce((a,x)=>a+x,0)/b.vols.length)
  }));
}
function chartSvg(B){
  const W=340,H=210,L=18,R=18,T=28,Bm=46,base=H-Bm;
  const vs=B.map(b=>b.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(lo===hi){lo-=1;hi+=1}else{const p=(hi-lo)*.2;lo-=p;hi+=p}
  const X=i=>B.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(B.length-1);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(base-T);
  let g='<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--s,var(--ac));stop-opacity:.35"/><stop offset="1" style="stop-color:var(--s,var(--ac));stop-opacity:0"/></linearGradient></defs>';
  for(let k=0;k<3;k++){const y=T+k*(base-T)/2;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)"/>'}
  const pts=B.map((b,i)=>X(i)+','+Y(b.v));
  if(B.length>1)g+='<path d="M'+pts.join(' L')+' L'+X(B.length-1)+','+base+' L'+X(0)+','+base+' Z" fill="url(#gr)"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" style="stroke:var(--s,var(--ac))" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  const fs=B.length>8?10:12;
  B.forEach((b,i)=>{
    g+='<circle cx="'+X(i)+'" cy="'+Y(b.v)+'" r="5" style="fill:var(--s,var(--ac))" stroke="var(--card)" stroke-width="2"/>'+
    '<text x="'+X(i)+'" y="'+(Y(b.v)-10)+'" text-anchor="middle" fill="var(--tx)" font-size="'+fs+'" font-weight="700">'+num(b.v)+'</text>'+
    '<text x="'+X(i)+'" y="'+(base+17)+'" text-anchor="middle" fill="var(--mut)" font-size="11">'+b.label+'</text>';
    if(b.yr&&(i===0||b.mo===1))g+='<text x="'+X(i)+'" y="'+(base+31)+'" text-anchor="middle" fill="var(--mut)" font-size="10">'+b.yr+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progress chart">'+g+'</svg>';
}
function renderProg(){
  const app=$('#app');
  if(!P.demo&&!S.log.length){
    app.innerHTML='<h1>Progress</h1><div class="sub">Charts built from your finished workouts</div><div class="card mut">No workouts logged yet. Finish a few sessions and your charts appear here.<br><br><button class="pri" data-pdemo="1">Preview with sample data</button></div>';
    return;
  }
  if(P.demo){P.session='Upper 1';P.ex='Chest press'}
  if(!P.session)P.session=SESSIONS.find(x=>src().some(l=>l.session===x))||'Upper 1';
  const names=exNames(P.session);
  if(!names.some(n=>n.toLowerCase()===(P.ex||'').toLowerCase()))P.ex=names[0]||null;
  app.style.setProperty('--s',(SC[P.session]||SC['Upper 1'])[0]);
  let h='<h1>Progress</h1><div class="sub">'+(P.demo?'Sample data, not your workouts':'Read-only. Your log is never changed here')+'</div><div class="pills">'+
    SESSIONS.map(x=>'<button class="pill" style="background:'+grad(x)+';opacity:'+(x===P.session?1:.4)+'" data-psess="'+x+'"'+(P.demo?' disabled':'')+'>'+x+'</button>').join('')+'</div>';
  if(!names.length){app.innerHTML=h+'<div class="card mut">No finished '+P.session+' workouts yet.</div>';return}
  h+='<select id="psx"'+(P.demo?' disabled':'')+'>'+names.map(n=>'<option'+(n.toLowerCase()===P.ex.toLowerCase()?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>'+
    '<div class="seg"><button data-pmode="month" class="'+(P.mode==='month'?'on':'')+'">Monthly</button><button data-pmode="five" class="'+(P.mode==='five'?'on':'')+'">Every 5 workouts</button></div>'+
    '<div class="seg"><button data-pmet="top" class="'+(P.metric==='top'?'on':'')+'">Top weight</button><button data-pmet="vol" class="'+(P.metric==='vol'?'on':'')+'">Volume</button></div>';
  const B=buckets();
  if(!B.length){h+='<div class="card mut">Not enough data for this exercise yet.</div>'}
  else{
    const u=B[B.length-1].unit,first=B[0].v,last=B[B.length-1].v,diff=num(last-first);
    const unitTxt=P.metric==='top'?(u==='bw'?' reps':' '+u):(u==='bw'?' reps':' '+u+'×reps');
    h+='<div class="card chart"><b>'+esc(P.ex)+'</b><div class="mut">'+(P.metric==='top'?(u==='bw'?'Best reps in a set':'Heaviest set'):'Average volume per workout')+' · '+(P.mode==='month'?'by month':'every 5 workouts')+'</div>'+chartSvg(B)+
      '<div class="stat"><span>Now: '+num(last)+unitTxt+'</span>'+(B.length>1?'<span>'+(diff>=0?'▲ +':'▼ ')+diff+unitTxt+(first?' ('+(diff>=0?'+':'')+Math.round(diff/first*100)+'%)':'')+' since start</span>':'<span>Need 2+ periods for a trend</span>')+'</div></div>';
  }
  if(P.demo)h+='<button class="wide" data-pdemo="0">Hide sample data</button>';
  app.innerHTML=h;
}

function render(){
  $('#t1').className=(view==='home'||view==='sess')?'on':'';
  $('#t2').className=view==='prog'?'on':'';
  $('#t3').className=view==='hist'?'on':'';
  if(view==='hist')renderHist();else if(view==='prog')renderProg();else if(view==='sess'&&S.draft)renderSess();else{view='home';renderHome()}
}

function start(s){
  if(S.draft&&S.draft.session!==s&&!confirm('You have an unfinished '+S.draft.session+' workout. Discard it and start '+s+'?'))return;
  if(!S.draft||S.draft.session!==s)S.draft={session:s,date:todayStr(),exercises:clone(plan(s))};
  save();view='sess';render();window.scrollTo(0,0);
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  const d=S.draft;
  if(t.id==='t1'){view=view==='sess'?'sess':(S.draft&&view==='prog'?'sess':'home');render()}
  else if(t.id==='t2'){view='prog';render()}
  else if(t.id==='t3'){view='hist';render()}
  else if(t.dataset.psess){P.session=t.dataset.psess;P.ex=null;render()}
  else if(t.dataset.pmode){P.mode=t.dataset.pmode;render()}
  else if(t.dataset.pmet){P.metric=t.dataset.pmet;render()}
  else if(t.dataset.pdemo!==undefined){P.demo=t.dataset.pdemo==='1';if(!P.demo){P.session=null;P.ex=null}render()}
  else if(t.dataset.skip!==undefined){const e=d.exercises[+t.dataset.skip];e.skip=!e.skip;save();render()}
  else if(t.dataset.start){start(t.dataset.start)}
  else if(t.dataset.act==='home'){view='home';render()}
  else if(t.id==='addx'){
    const n=$('#nx').value.trim();if(!n)return;
    const u=unitFor(n);
    d.exercises.push({name:n,unit:u,sets:[{w:u==='bw'?0:'',r:''}]});save();render();
  }
  else if(t.dataset.add!==undefined){
    const e=d.exercises[+t.dataset.add],p=e.sets[e.sets.length-1];
    e.sets.push(p?{...p}:{w:e.unit==='bw'?0:'',r:''});save();render();
  }
  else if(t.dataset.ds!==undefined){
    const [i,j]=t.dataset.ds.split(',').map(Number);
    d.exercises[i].sets.splice(j,1);
    if(!d.exercises[i].sets.length)d.exercises.splice(i,1);
    save();render();
  }
  else if(t.dataset.del!==undefined){
    if(confirm('Remove this exercise?')){d.exercises.splice(+t.dataset.del,1);save();render()}
  }
  else if(t.dataset.unit!==undefined){
    const e=d.exercises[+t.dataset.unit],old=e.unit;
    e.unit=UNITS[(UNITS.indexOf(old)+1)%UNITS.length];
    if(e.unit==='bw')e.sets.forEach(s=>s.w=0);else if(old==='bw')e.sets.forEach(s=>s.w='');
    save();render();
  }
  else if(t.dataset.act==='finish'){
    const ups=countUps(),logged=[],np=[];
    d.exercises.forEach(e=>{
      const base={name:e.name,unit:e.unit};
      const sets=e.sets.filter(x=>!(x.r===''&&(x.w===''||e.unit==='bw')));
      if(!e.skip&&sets.length){logged.push({...base,sets});np.push({...base,sets:clone(sets)})}
      else np.push({...base,sets:clone(e.sets)});
    });
    if(!logged.length){alert('Nothing to log yet. Fill in at least one exercise (skipped ones don’t count).');return}
    S.log.push({session:d.session,date:d.date,exercises:logged});
    S.plan=S.plan||{};S.plan[d.session]=np;
    S.draft=null;save();view='home';render();window.scrollTo(0,0);
    toast('Workout saved ✓'+(ups?' · ▲ '+ups+' sets improved':''));
  }
  else if(t.dataset.act==='discard'){
    if(confirm('Discard this workout?')){S.draft=null;save();view='home';render()}
  }
  else if(t.dataset.hdel!==undefined){
    if(confirm('Delete this workout from history?')){S.log.splice(+t.dataset.hdel,1);save();render()}
  }
  else if(t.dataset.act==='copy'){
    navigator.clipboard.writeText(JSON.stringify(S)).then(()=>alert('Backup copied. Paste it into Notes to keep it.'),()=>alert('Copy failed.'));
  }
  else if(t.dataset.act==='restore'){
    const p=prompt('Paste your backup here');if(!p)return;
    try{const o=JSON.parse(p);if(!Array.isArray(o.log))throw 0;S=o;save();render();alert('Restored.')}catch(e){alert('That backup is not valid.')}
  }
});

document.addEventListener('change',ev=>{if(ev.target.id==='psx'){P.ex=ev.target.value;render()}});

document.addEventListener('input',ev=>{
  const t=ev.target;if(!t.dataset.f)return;
  const i=+t.dataset.i,j=+t.dataset.j;
  S.draft.exercises[i].sets[j][t.dataset.f]=t.value===''?'':Number(t.value);
  const m=t.closest('.set').firstChild,up=isUp(i,j),was=m.className==='up';
  m.className=up?'up':'';m.textContent=up?'▲':j+1;
  if(up&&!was){m.style.animation='none';void m.offsetWidth;m.style.animation=''}
  const u=$('#upc');if(u)u.textContent=upText();
  save();
});

render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
