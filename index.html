<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Log</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#111;--mut:#6b7280;--ac:#16a34a;--acx:#fff;--bd:#e5e7eb;--dng:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--card:#1a1a1f;--tx:#f3f4f6;--mut:#9ca3af;--bd:#2a2a31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0d;--card:#1a1a1f;--tx:#f3f4f6;--mut:#9ca3af;--bd:#2a2a31;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.ex-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ex-h b{font-size:17px}
.last{color:var(--mut);font-size:13px;margin-bottom:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:6px}
.set span{color:var(--mut);text-align:center}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;box-sizing:border-box;text-align:center}
input.name{text-align:left}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--bd);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);font-weight:600}
button.x{background:none;color:var(--dng);padding:6px 8px}
.row{display:flex;gap:8px}
.row input{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border-radius:0;background:none;padding:14px}
.tabs button.on{color:var(--ac);font-weight:700}
.hist{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
#st{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:12px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<span id="st"></span>
<main id="app"></main>
<nav class="tabs"><button id="t1">Workout</button><button id="t2">History</button></nav>
<script>
const $=s=>document.querySelector(s);
const LS='gymlog.v1';
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let workouts={},db=null,uid=null,view='work',cur=todayStr();
const timers={};

function loadLocal(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(workouts))}catch(e){}}
function setSt(t){$('#st').textContent=t}
function wk(d){return workouts[d]||(workouts[d]={date:d,exercises:[]})}

function persist(d){saveLocal();setSt('Saved')}

function lastFor(name,before){
  const dates=Object.keys(workouts).filter(d=>d<before).sort().reverse();
  for(const d of dates){
    const e=workouts[d].exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(e&&e.sets.length) return e.sets;
  }
  return null;
}
const fmt=s=>s.map(x=>(x.w||0)+'×'+(x.r||0)).join(', ');
const allNames=()=>[...new Set(Object.values(workouts).flatMap(w=>w.exercises.map(e=>e.name)))].sort();

function renderWork(){
  const w=wk(cur);
  let h='<h1>'+(cur===todayStr()?'Today’s workout':cur)+'</h1><div class="sub">Weights in kg</div>';
  w.exercises.forEach((e,i)=>{
    const l=lastFor(e.name,cur);
    h+='<div class="card"><div class="ex-h"><b>'+esc(e.name)+'</b><button class="x" data-del="'+i+'">Remove</button></div>';
    h+='<div class="last">'+(l?'Last time: '+fmt(l):'No previous log')+'</div>';
    e.sets.forEach((s,j)=>{
      h+='<div class="set"><span>'+(j+1)+'</span>'+
      '<input type="number" inputmode="decimal" placeholder="kg" value="'+(s.w??'')+'" data-i="'+i+'" data-j="'+j+'" data-f="w">'+
      '<input type="number" inputmode="numeric" placeholder="reps" value="'+(s.r??'')+'" data-i="'+i+'" data-j="'+j+'" data-f="r">'+
      '<button class="x" data-ds="'+i+','+j+'">✕</button></div>';
    });
    h+='<button data-add="'+i+'">+ Add set</button></div>';
  });
  h+='<div class="card"><div class="row"><input class="name" id="nx" list="nl" placeholder="Add exercise (e.g. Bench press)">'+
  '<button class="pri" id="addx">Add</button></div><datalist id="nl">'+allNames().map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist></div>';
  $('#app').innerHTML=h;
}

function renderHist(){
  const ds=Object.keys(workouts).filter(d=>workouts[d].exercises.length).sort().reverse();
  let h='<h1>History</h1><div class="sub">'+ds.length+' workouts logged</div>';
  if(!ds.length)h+='<div class="card mut">Nothing logged yet.</div>';
  ds.forEach(d=>{
    const w=workouts[d];
    h+='<div class="card"><div class="hist" data-open="'+d+'"><b>'+d+'</b><span class="mut">'+w.exercises.length+' exercises ›</span></div>'+
    w.exercises.map(e=>'<div class="mut">'+esc(e.name)+': '+fmt(e.sets)+'</div>').join('')+'</div>';
  });
  h+='<div class="card"><b>Backup</b><div class="mut" style="margin:4px 0 8px">Data lives on this phone only.</div><div class="row"><button data-act="copy">Copy backup</button><button data-act="restore">Restore</button></div></div>';
  $('#app').innerHTML=h;
}

function render(){
  $('#t1').className=view==='work'?'on':'';
  $('#t2').className=view==='hist'?'on':'';
  view==='work'?renderWork():renderHist();
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-open]');if(!t)return;
  const w=wk(cur);
  if(t.id==='t1'){view='work';cur=todayStr();render()}
  else if(t.id==='t2'){view='hist';render()}
  else if(t.id==='addx'){
    const n=$('#nx').value.trim();if(!n)return;
    const l=lastFor(n,cur);
    w.exercises.push({name:n,sets:[l?{...l[l.length-1]}:{w:'',r:''}]});
    persist(cur);render();
  }
  else if(t.dataset.add!==undefined){
    const e=w.exercises[+t.dataset.add];const p=e.sets[e.sets.length-1];
    e.sets.push(p?{...p}:{w:'',r:''});persist(cur);render();
  }
  else if(t.dataset.ds!==undefined){
    const [i,j]=t.dataset.ds.split(',').map(Number);
    w.exercises[i].sets.splice(j,1);
    if(!w.exercises[i].sets.length)w.exercises.splice(i,1);
    persist(cur);render();
  }
  else if(t.dataset.del!==undefined){
    if(confirm('Remove this exercise?')){w.exercises.splice(+t.dataset.del,1);persist(cur);render()}
  }
  else if(t.dataset.open){cur=t.dataset.open;view='work';render()}
  else if(t.dataset.act==='copy'){
    navigator.clipboard.writeText(JSON.stringify(workouts)).then(()=>alert('Backup copied. Paste it into Notes to keep it.'),()=>alert('Copy failed.'));
  }
  else if(t.dataset.act==='restore'){
    const p=prompt('Paste your backup here');if(!p)return;
    try{const o=JSON.parse(p);Object.assign(workouts,o);saveLocal();render();alert('Restored.')}catch(e){alert('That backup is not valid.')}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t.dataset.f)return;
  const s=wk(cur).exercises[+t.dataset.i].sets[+t.dataset.j];
  s[t.dataset.f]=t.value===''?'':Number(t.value);
  persist(cur);
});

workouts=loadLocal();render();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
